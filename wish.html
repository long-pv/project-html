<!-- src/html/index.html -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

		<link rel="stylesheet" href="/assets/css/vendor.css" />
		<!-- Thêm vendor.css -->
		<link rel="stylesheet" href="/assets/css/main.css" />
		<!-- style.css -->
	</head>

	<body>
		<!-- Include header -->
		<header></header>

		<!-- Main content of the page -->
		<main>
			<!-- Main content -->
			<div class="container py-5">
				<div class="lv_wish_pageWrapper">
					<div class="lv_wish_container">
						<!-- Title -->
						<div class="lv_wish_title">
							<div class="lv_wish_titleMain">Lời Chúc Dành Cho Bạn</div>
						</div>

						<!-- Message -->
						<div class="lv_wish_message">
							<!-- Toggle -->
							<input type="checkbox" id="lv_wish_toggle" class="lv_wish_toggle" />

							<!-- Envelope -->
							<label for="lv_wish_toggle" class="lv_wish_envelope">
								<!-- Back -->
								<div class="lv_wish_envelopeBack"></div>

								<!-- Side triangles -->
								<div class="lv_wish_envelopeLeft"></div>
								<div class="lv_wish_envelopeRight"></div>

								<!-- Top flap -->
								<div class="lv_wish_envelopeFlap"></div>

								<!-- Letter -->
								<div class="lv_wish_letter">
									<div class="lv_wish_letterTo">Gửi: My Love</div>

									<div class="lv_wish_letterContent">
										Chúc em một ngày mới thật ngọt ngào, tràn đầy niềm vui<br />
										và hạnh phúc. Luôn yêu em!
									</div>

									<div class="lv_wish_letterSign">— Anh Yêu</div>
								</div>

								<div class="lv_wish_envelopeSeal"></div>
							</label>
						</div>
					</div>
				</div>
			</div>
		</main>

		<!-- Include footer -->
		<footer></footer>

		<script src="/assets/js/vendor.js"></script>
		<!-- vendor.js -->
		<script src="/assets/js/main.js"></script>
		<!-- main.js -->
	</body>
</html>
