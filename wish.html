<!-- src/html/index.html -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

		<link rel="stylesheet" href="/assets/css/vendor.css" />
		<!-- Thêm vendor.css -->
		<link rel="stylesheet" href="/assets/css/main.css" />
		<!-- style.css -->
	</head>

	<body>
		<!-- Include header -->
		<header></header>

		<script src="/assets/js/animate-heart-canvas-browser.js"></script>
		<script>
			let queryData = getSearchData();
			console.log(queryData);
			let animateHeartCanvas = new AnimateHeartCanvas(Number(queryData.hMin), Number(queryData.hMax), Number(queryData.countHeart), Number(queryData.sizeMin), Number(queryData.sizeMax), queryData.bgColor);

			/****************************
			 *
			 *  获取地址栏get数据
			 *
			 *  - 有值的时候返回一个包含所有参数的对象
			 *  - 无值的时候，返回 `false`
			 *
			 ****************************/

			function getSearchData() {
				let searchString = location.search;
				if (searchString) {
					let obj = {};
					searchString = searchString.substring(1, searchString.length);
					let tempArray = searchString.split("&");
					tempArray.forEach((item) => {
						obj[item.split("=")[0]] = decodeURIComponent(item.split("=")[1]);
					});
					return obj;
				} else {
					return false;
				}
			}
		</script>

		<!-- Main content of the page -->
		<main>
			<div class="lv_revealOverlay">
				<div class="lv_revealContent">
					<div class="lv_revealText">Có điều dành cho bạn...</div>
					<div class="lv_revealSub">Hãy chờ một chút nhé ❤️</div>
				</div>
			</div>
			<!-- Main content -->
			<div class="container">
				<div class="lv_wish_pageWrapper">
					<div class="lv_wish_container">
						<!-- Title -->
						<div class="lv_wish_title">
							<div class="lv_wish_titleMain">Lời Chúc Dành Cho Bạn</div>
						</div>

						<!-- Message -->
						<div class="lv_wish_message">
							<!-- Toggle -->
							<input type="checkbox" id="lv_wish_toggle" class="lv_wish_toggle" />

							<!-- Envelope -->
							<label for="lv_wish_toggle" class="lv_wish_envelope">
								<!-- Back -->
								<div class="lv_wish_envelopeBack"></div>

								<!-- Side triangles -->
								<div class="lv_wish_envelopeLeft"></div>
								<div class="lv_wish_envelopeRight"></div>

								<!-- Top flap -->
								<div class="lv_wish_envelopeFlap"></div>

								<!-- Letter -->
								<div class="lv_wish_letter">
									<div class="lv_wish_letterTo">Gửi: My Love</div>

									<div class="lv_wish_letterContent">Lorem ipsum dolor sit amet consectetur adipisicing elit. In quo repellat esse consequatur architecto odio eligendi accusantium, dolore nobis perferendis eveniet non ipsum quia porro deleniti. Culpa, delectus expedita? Rem!</div>

									<div class="lv_wish_letterSign">— Anh Yêu</div>
								</div>

								<div class="lv_wish_envelopeSeal"></div>
							</label>
						</div>
					</div>
				</div>
			</div>
		</main>

		<!-- Include footer -->
		<footer></footer>

		<style>
			canvas {
				opacity: 0.08;
			}

			.lv_revealOverlay {
				position: fixed;
				inset: 0;
				background: radial-gradient(circle, #ffe6ef, #ffc0d9);
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				transition:
					opacity 1.2s ease,
					visibility 1.2s ease;
			}

			.lv_revealOverlay.hide {
				opacity: 0;
				visibility: hidden;
			}

			.lv_revealContent {
				text-align: center;
				animation: fadeUp 1.5s ease;
			}

			.lv_revealText {
				font-size: 24px;
				font-weight: 700;
				color: #b4004e;
			}

			.lv_revealSub {
				margin-top: 8px;
				font-size: 14px;
				color: #8a003a;
				opacity: 0.8;
			}

			@keyframes fadeUp {
				from {
					opacity: 0;
					transform: translateY(12px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}
		</style>

		<script src="/assets/js/vendor.js"></script>
		<!-- vendor.js -->
		<script src="/assets/js/main.js"></script>
		<!-- main.js -->

		<script>
			jQuery(function ($) {
				setTimeout(function () {
					$(".lv_revealOverlay").addClass("hide");
				}, 3000);
			});
		</script>
	</body>
</html>
