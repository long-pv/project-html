<!-- src/html/index.html -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

		<link rel="stylesheet" href="/assets/css/vendor.css" />
		<!-- Thêm vendor.css -->
		<link rel="stylesheet" href="/assets/css/main.css" />
		<!-- style.css -->
	</head>

	<body>
		<!-- Include header -->
		<header></header>

		<!-- Main content of the page -->
		<main>
			<!-- Main content -->
			<div class="lv_pageWrapper_container">
				<div class="container py-5">
					<div class="row justify-content-center">
						<div class="col-12 col-md-8 col-lg-6">
							<div class="lv_loveForm_wrapper">
								<div class="lv_loveForm_header">
									<img class="lv_loveForm_header_img" src="/assets/images/logo-to-mee.png" alt="" />
								</div>

								<div class="lv_loveForm_intro">
									<h2 class="lv_loveForm_introTitle">Gửi Gắm Lời Yêu Thương</h2>
								</div>

								<form class="lv_loveForm_form">
									<div class="lv_loveForm_fieldGroup">
										<label class="lv_loveForm_labelReceiver">Người nhận</label>
										<input type="text" class="lv_loveForm_inputReceiver" placeholder="Ví dụ: My Love, Mom..." />
									</div>

									<div class="lv_loveForm_fieldGroup">
										<label class="lv_loveForm_labelSender">Từ người gửi</label>
										<input type="text" class="lv_loveForm_inputSender" placeholder="Tên của bạn" />
									</div>

									<div class="lv_loveForm_fieldGroup">
										<label class="lv_loveForm_labelMessage">Lời nhắn</label>
										<textarea class="lv_loveForm_textareaMessage" placeholder="Viết lời yêu thương tại đây..."></textarea>
										<span class="lv_loveForm_charCount">0 / 200</span>
									</div>

									<button type="submit" class="lv_loveForm_submitButton">❤️ Lưu Lời Chúc</button>
								</form>
							</div>

							<!-- preview -->
							<div class="lv_cardPreview_wrapper">
								<div class="lv_cardPreview_container">
									<span class="lv_cardPreview_label"> LIVE PREVIEW </span>

									<div class="lv_cardPreview_card">
										<div class="lv_cardPreview_border">
											<div class="lv_cardPreview_content">
												<h1 class="lv_cardPreview_title">Gửi: ...</h1>

												<div class="lv_cardPreview_divider"></div>

												<p class="lv_cardPreview_message">Lời chúc của bạn sẽ xuất hiện rực rỡ và sang trọng tại đây...</p>

												<span class="lv_cardPreview_signature"> — Tomee </span>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</main>

		<!-- Include footer -->
		<footer></footer>

		<style>
			.lv_loading {
				display: inline-block;
				width: 16px;
				height: 16px;
				border: 2px solid #fff;
				border-top: 2px solid transparent;
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				margin-right: 6px;
				vertical-align: middle;
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			.lv_formSuccess {
				margin-top: 12px;
				color: #2e7d32;
				font-weight: 600;
				text-align: center;
			}

			.lv_error {
				display: block;
				color: #d32f2f;
				font-size: 12px;
			}
		</style>

		<script src="/assets/js/vendor.js"></script>
		<!-- vendor.js -->
		<script src="/assets/js/main.js"></script>
		<!-- main.js -->

		<script>
			jQuery(function ($) {
				const $receiver = $(".lv_loveForm_inputReceiver");
				const $sender = $(".lv_loveForm_inputSender");
				const $message = $(".lv_loveForm_textareaMessage");

				const $previewTitle = $(".lv_cardPreview_title");
				const $previewMessage = $(".lv_cardPreview_message");
				const $previewSignature = $(".lv_cardPreview_signature");
				const $charCount = $(".lv_loveForm_charCount");

				// Người nhận → Title
				$receiver.on("input", function () {
					const val = $(this).val().trim();
					$previewTitle.text(`Gửi: ${val || "..."}`);
				});

				// Người gửi → Signature
				$sender.on("input", function () {
					const val = $(this).val().trim();
					$previewSignature.text(`— ${val || "Tomee"}`);
				});

				// Lời nhắn → Nội dung + đếm ký tự
				$message.on("input", function () {
					let val = $(this).val();

					if (val.length > 200) {
						val = val.substring(0, 200);
						$(this).val(val);
					}

					$previewMessage.text(val || "Lời chúc của bạn sẽ xuất hiện rực rỡ và sang trọng tại đây...");

					$charCount.text(`${val.length} / 200`);
				});
			});
		</script>

		<script>
			jQuery(function ($) {
				// gán name cho validate
				$(".lv_loveForm_inputReceiver").attr("name", "receiver");
				$(".lv_loveForm_inputSender").attr("name", "sender");
				$(".lv_loveForm_textareaMessage").attr("name", "message");

				const $form = $(".lv_loveForm_form");
				const $btn = $(".lv_loveForm_submitButton");
				const $charCount = $(".lv_loveForm_charCount");

				const $previewTitle = $(".lv_cardPreview_title");
				const $previewMessage = $(".lv_cardPreview_message");
				const $previewSignature = $(".lv_cardPreview_signature");

				$form.validate({
					rules: {
						receiver: {
							required: true,
							minlength: 3,
						},
						sender: {
							required: true,
							minlength: 3,
						},
						message: {
							required: true,
							maxlength: 200,
						},
					},

					messages: {
						receiver: {
							required: "Trường người nhận không được bỏ trống",
							minlength: "Người nhận phải có ít nhất 3 ký tự",
						},
						sender: {
							required: "Trường người gửi không được bỏ trống",
							minlength: "Người gửi phải có ít nhất 3 ký tự",
						},
						message: {
							required: "Lời nhắn không được bỏ trống",
							maxlength: "Lời nhắn tối đa 200 ký tự",
						},
					},

					errorElement: "span",
					errorClass: "lv_error",

					submitHandler: function (form) {
						$(".lv_formSuccess").remove();

						$btn.prop("disabled", true).html('<span class="lv_loading"></span> Đang gửi...');

						setTimeout(function () {
							form.reset();

							$previewTitle.text("Gửi: ...");
							$previewMessage.text("Lời chúc của bạn sẽ xuất hiện rực rỡ và sang trọng tại đây...");
							$previewSignature.text("— Tomee");
							$charCount.text("0 / 200");

							$btn.prop("disabled", false).html("❤️ Lưu Lời Chúc");

							$btn.after('<div class="lv_formSuccess">✨ Lời chúc đã được lưu thành công!</div>');
						}, 2000);

						return false;
					},
				});
			});
		</script>
	</body>
</html>
